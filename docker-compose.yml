services:
  postgres:
    image: postgres:16-alpine
    container_name: joineazy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-joineazy}
      POSTGRES_USER: ${PGUSER:-joineazy_user}
      POSTGRES_PASSWORD: ${PGPASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-joineazy_user} -d ${PGDATABASE:-joineazy}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - joineazy-net

  backend:
    build:
      context: ./backend
    container_name: joineazy-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: development
      CLIENT_ORIGIN: http://localhost:5173
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE:-joineazy}
      PGUSER: ${PGUSER:-joineazy_user}
      PGPASSWORD: ${PGPASSWORD:-change_me}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in your environment or .env file}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      JWT_COOKIE_MAX_AGE_MS: ${JWT_COOKIE_MAX_AGE_MS:-86400000}
      GROUP_MAX_MEMBERS: ${GROUP_MAX_MEMBERS:-4}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - joineazy-net

  frontend:
    build:
      context: ./frontend
    container_name: joineazy-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - joineazy-net

volumes:
  pgdata:

networks:
  joineazy-net:
    driver: bridge
