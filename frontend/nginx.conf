server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets for faster loads.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Cache hashed build assets aggressively; Vite fingerprints filenames
    # on every build so this is safe.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router uses client-side routing (e.g. /dashboard/student),
    # so any path that isn't a real file must fall back to index.html —
    # otherwise a hard refresh on a non-root route 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
